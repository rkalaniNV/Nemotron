# Ablation init: replace/hfdefault
run:
  env:
    env_vars:
      WANDB_PROJECT: sovai-tokenizer-ablation
      WANDB_NAME: ${oc.env:WANDB_NAME,abl-init-replace-hfdefault}
base_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
dtype: bfloat16
arm: replace
extended_tokenizer: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/tokenizers/nano3_1M_30k_replace
output_dir: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/checkpoints/nano3_replace_hfdefault_hf
method: baseline
baseline:
  mode: hf_default
  norm_correction: false
