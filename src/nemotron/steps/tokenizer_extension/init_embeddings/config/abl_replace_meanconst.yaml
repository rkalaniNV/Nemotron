# Ablation init: replace/meanconst
run:
  env:
    env_vars:
      WANDB_PROJECT: sovai-tokenizer-ablation
      WANDB_NAME: ${oc.env:WANDB_NAME,abl-init-replace-meanconst}
base_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
dtype: bfloat16
arm: replace
extended_tokenizer: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/tokenizers/nano3_1M_30k_replace
output_dir: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/checkpoints/nano3_replace_meanconst_hf
method: subword
subword:
  input_averaging: uniform
  output_averaging: uniform
  input_norm_correction: true
  output_norm_correction: false
  input_hindi_norm: true
  output_hindi_norm: false
