# Ablation init: replace/focus
run:
  env:
    env_vars:
      WANDB_PROJECT: sovai-tokenizer-ablation
      WANDB_NAME: ${oc.env:WANDB_NAME,abl-init-replace-focus}
base_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
dtype: bfloat16
arm: replace
extended_tokenizer: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/tokenizers/nano3_1M_30k_replace
output_dir: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/checkpoints/nano3_replace_focus_hf
method: focus
focus:
  fasttext_model: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/aux/cc.hi.300.bin
  fasttext_url: https://dl.fbaipublicfiles.com/fasttext/vectors-crawl/cc.hi.300.bin.gz
  candidate_pool: hindi
  sparsemax_temperature: 0.05
