# Ablation BPB (pre-CPT init quality): add arm methods vs base, held-out Samanantar hi.
# BPB is byte-normalized => comparable across vocabs (base 131k vs extended).
run:
  env:
    env_vars:
      WANDB_PROJECT: sovai-tokenizer-ablation
      WANDB_NAME: ${oc.env:WANDB_NAME,abl-bpb-add}
base_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
models:
  - /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/checkpoints/nano3_add_meanconst_hf
  - /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/checkpoints/nano3_add_hfdefault_hf
  - /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/checkpoints/nano3_add_focus_hf
  - /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/checkpoints/nano3_add_bert_hf
corpus:
  hf_dataset: ai4bharat/samanantar
  hf_config: hi
  hf_split: train
  text_field: tgt
  skip_docs: 0
max_docs: 3000
max_tokens: 1000000
max_length: 2048
stride: 512
dtype: bfloat16
output_json: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/eval/bpb_add.json
