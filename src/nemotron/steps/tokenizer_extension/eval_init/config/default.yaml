# BPB / perplexity eval of extended checkpoints vs the base model.
# BPB (bits-per-byte) is the cross-vocabulary-comparable metric.

base_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
models:
  - /mnt/lustre-shared/indic-cpt/checkpoints/nano3_add_subword_hf

# Local validation corpus (.jsonl with `text_field`, or .txt one doc per line).
data_file: /mnt/lustre-shared/indic-cpt/eval/hindi_val.jsonl
text_field: text

max_docs: -1
max_tokens: 500000
max_length: 2048
stride: 512
dtype: bfloat16

output_json: /mnt/lustre-shared/indic-cpt/eval/bpb_nano3_add_subword.json
