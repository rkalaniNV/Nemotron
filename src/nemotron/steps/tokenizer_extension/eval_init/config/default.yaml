# BPB / perplexity eval of extended checkpoints vs the base model.
# BPB (bits-per-byte) is the cross-vocabulary-comparable metric.

base_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
models:
  - ./output/tokenizer_extension/checkpoints/nano3_add_subword_hf

# Local validation corpus (.jsonl with `text_field`, or .txt one doc per line).
data_file: ./data/eval/target_val.jsonl
text_field: text

# max_docs caps the document stream and is tokenizer-independent: use it (or
# -1 = whole corpus) when comparing BPB across tokenizers. A max_tokens budget
# stops each tokenizer after a different amount of text and is NOT comparable.
max_docs: -1
max_tokens: -1
max_length: 2048
stride: 512
dtype: bfloat16

output_json: ./output/tokenizer_extension/eval/bpb_nano3_add_subword.json
