# Ablation fertility: replace tokenizer on FULL Samanantar hi (tokens/word compression)
run:
  env:
    env_vars:
      WANDB_PROJECT: sovai-tokenizer-ablation
      WANDB_NAME: ${oc.env:WANDB_NAME,abl-fert-replace}
tokenizer: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/tokenizers/nano3_1M_30k_replace
label: abl-replace-1M-30k
trust_remote_code: true
corpus:
  hf_dataset: ai4bharat/samanantar
  hf_config: hi
  hf_split: train
  path: null
  glob: "*.parquet"
  text_field: tgt
  num_docs: 0            # 0 => full corpus
  skip_docs: 0
batch_size: 1000
output: /mnt/lustre-shared/rapaul/ablation/tokenizer_extension/eval/fertility_replace.json
