# Starting point for a customer safety run.
# Copy this file, point input_dir at the customer policy directory, and keep family: safety.
# Relative paths resolve from src/nemotron/steps/byob, not from the current directory, so use
# absolute paths for customer folders.
# Run prepare, generate/review/approve, then eval. stage=all runs prepare + generate;
# evaluation remains explicit because it requires an already published benchmark.

family: safety
expt_name: customer-safety-v1
stage: prepare
config_status: resolved
mode: assisted

output_dir: /tmp/byob-safety
input_dir: safety/examples/policies

assurance:
  profile: standard

budget:
  assisted_max_cases: 500
  max_review_items: 40
  # Per-rule max for high/medium/low. Critical uses cases_per_critical_rule (12).
  # cases_per_normal_rule: 6
  # Mix multi-turn is optional and never exceeds this cap. Minima cannot exceed
  # these maxima or assisted_max_cases; the config is refused instead.

# Optional publication gates. Counts are evaluated after validation, exact
# deduplication, and semantic near-dup filtering. An unmet gate blocks
# Gold and is reported in split_manifest.json, review.html, and quality_report.json.
# on_failure: silver publishes anyway; fail blocks publication after review.
# Minima must fit inside the budget caps (load-time error otherwise). The planner
# may backfill unscheduled distinct cells into room left by rejected rows. It
# never pads the dataset by copying the same source quote.
# quality_gates:
#   min_total_cases: 100
#   min_development_cases: 40
#   min_cases_per_policy: 4
#   min_cases_per_action: {allow: 20, block: 20}
#   min_cases_per_language: {vi: 20}
#   on_failure: silver

generation:
  modules:
    adversarial: false
    persona: false
    # Rewrite seed quote-copies into realistic user turns. Python keeps the
    # coverage cell (legs, expected_action, evidence). Without a generation
    # model the seeds are kept. Paraphrase lifts a 0.0 extract temperature so
    # rewrites can vary; the scored turn must realize present_legs.
    paraphrase: true
  # Optional. Default is single_turn 0.80 / multi_turn 0.20. A positive
  # multi_turn share adds optional multi-turn cells from single-turn rules
  # even when the quote does not ground multi_turn_turns.
  # turn_mix:
  #   single_turn: 0.80
  #   multi_turn: 0.20

# Same Curator near-dup knobs as MCQ. Compares scored user turns only inside
# the same language and expected action after exact dedup. Contrast-family
# members are not dropped. An enabled stage fails closed when Curator cannot run.
semantic_deduplication_config:
  enabled: true
  model_identifier: sentence-transformers/all-MiniLM-L6-v2
  n_clusters: 1
  eps: 0.07
  remove_duplicates: true

