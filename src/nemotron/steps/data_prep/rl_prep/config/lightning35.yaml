# Nemotron 3.5 Lightning RL data prep.
# Downloads nvidia/Nemotron-RL-Lightning-Training-Blend (rlvr.jsonl), restores
# DAPO/Skywork `_hf_question_placeholder` rows, and writes train/val + manifest.json
# for rl/nemo_rl/rlvr -c lightning35.
#
#   nemotron steps run data_prep/rl_prep -c lightning35 --batch lepton_lightning35_rl_prep

defaults: default.yaml

run:
  env:
    container_image: nvcr.io/nvidia/nemo:26.08
    env_vars:
      WANDB_NAME: ${oc.env:WANDB_NAME,data-prep-rl-prep-lightning35}

blend_path: data/blend_lightning35.json
output_dir: ${oc.env:RL_PREP_OUTPUT_DIR,${oc.env:RL_OUTPUT_DIR,./output/data_prep/rl_prep/lightning35}}
prep_backend: released_jsonl
val_holdout: 1000
# The Lepton preset uses colocated policy generation and no external GPU judge
# or sandbox pools. Keep only Gym agents whose reward servers are provided by
# env.nemo_gym.config_paths in the matching Lightning RL config. The complete
# released blend requires NVIDIA's 86-node reference topology.
allowed_agent_names:
  - math_with_judge_simple_agent
  - code_gen_simple_agent
  - single_step_tool_use_with_argument_comparison_agent
  - workplace_assistant_simple_agent
  - mcqa_simple_agent
  - instruction_following_simple_agent
  - structured_outputs_simple_agent
config_name: lightning35
