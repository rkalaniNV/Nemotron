[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "long-context-sdg"
version = "0.1.0"
description = "Domain-neutral long-context tool-calling synthetic data generation for NeMo Data Designer."
requires-python = ">=3.11,<3.14"
dependencies = [
    "data-designer>=0.5.6",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "omegaconf>=2.3",
    "pandas>=2.0",
    "pydantic>=2.6",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
long-context-sdg = "long_context_sdg.__main__:main"

[project.entry-points."data_designer.plugins"]
long-context-episode-simulator = "long_context_sdg.plugin:long_context_episode_simulator"

[tool.hatch.build.targets.wheel]
packages = ["src/long_context_sdg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
