# ============================================================================
# Agentic-RAG deep-research SDG — STREAMING PIPELINE config (Stages 1-6).
#
# Drives pipeline.py: cluster whole docs (Stage 1), then per cluster chunk +
# index + generate questions (Stage 2) and run trajectories (Stages 3-6), one
# cluster at a time. Everything domain-specific lives here; the code is generic.
# ============================================================================

output_dir: ${oc.env:SDG_OUTPUT_DIR,${oc.env:PWD}/output/sdg}
output_path: ${output_dir}/agentic_rag_pipeline.jsonl

# ── Stage 1: whole-document clustering (no chunking) ─────────────────────────
clustering:
  input: ../data/documents       # the 20 prepared documents
  doc_unit: file                 # each file is a document
  profile: indian_statute        # profile used for Stage-2 chunking
  output_root: ../data/clusters  # global manifest + per-cluster docs land here
  algo: kmeans
  k: 4                           # ~5 documents per cluster
  min_cluster_size: 5
  max_chars: 40000               # whole-doc mean-pool embedding window

# ── Stage 2: per-cluster chunking + question generation ──────────────────────
question_gen:
  profile: indian_statute
  chunk_max_chars: 2000          # retrieval-chunk size
  chunk_overlap: 0
  shard_max_chars: 8000          # generator window; shard docs longer than this
  n_queries: 5                   # queries PER DOCUMENT (spread across shards); spans the spectrum
  generator_alias: question_model  # gpt-oss-120b — reliable JSON question-gen
  backend: embedding
  max_docs: null                 # all docs/cluster
  queries_fraction: 0.2          # run trajectories for 20% of the generated queries (diverse subset)
  per_cluster_records: null      # DD rows/cluster; null = one per sampled query

# ── custom provider: NVIDIA inference endpoint (OpenAI-compatible) ────────────
providers:
  - name: nvidia-inference
    endpoint: https://inference-api.nvidia.com/v1
    provider_type: openai
    api_key: NVIDIA_API_KEY

# ── the four model roles ─────────────────────────────────────────────────────
models:
  - alias: user_model
    model: nvidia/qwen/qwen3.6-35b-a3b
    provider: nvidia-inference
    inference_parameters: {temperature: 0.9, top_p: 0.95, max_tokens: 2000}
  - alias: assistant_model
    model: nvidia/openai/gpt-oss-120b
    provider: nvidia-inference
    inference_parameters: {temperature: 0.6, top_p: 0.95, max_tokens: 2500}
  - alias: api_response_model
    model: nvidia/deepseek-ai/deepseek-v4-flash
    provider: nvidia-inference
    inference_parameters: {temperature: 0.5, top_p: 0.95, max_tokens: 512}
  - alias: judge_model
    model: nvidia/qwen/qwen3.6-35b-a3b
    provider: nvidia-inference
    inference_parameters: {temperature: 0.1, top_p: 1.0, max_tokens: 2000}
  - alias: question_model
    model: nvidia/openai/gpt-oss-120b
    provider: nvidia-inference
    inference_parameters: {temperature: 0.9, top_p: 0.95, max_tokens: 4000}

# ── DD columns: theme sampler + the deep-research simulator ───────────────────
# seed_query / cluster_id / gold_sections / conversation_variant / persona come
# from the per-cluster seed (built by step.enrich_query_seed) and are surfaced
# automatically; no need to declare them here.
columns:
  - type: category
    name: theme
    values:
      - '{"type": "citizen_query", "description": "an ordinary person seeking to understand their rights"}'
      - '{"type": "practitioner", "description": "a professional needing precise, cross-referenced provisions"}'
      - '{"type": "student", "description": "a learner asking comparative, conceptual questions"}'

  - type: deep-research-simulator
    name: trajectory
    model_alias: assistant_model
    # seed plumbing (Stage 3)
    query_column: seed_query
    cluster_id_column: cluster_id
    gold_column: gold_sections
    query_level_column: query_level

    # retrieval — per-cluster indexes under this root: <root>/<cluster_id>/index
    retrieval_tools: [search_articles, get_article]
    retriever_backend: embedding
    index_base_dir: ../data/clusters
    top_k: 4
    subsample_retrieval: true      # Stage 3: oversample 2x then random-subsample to top_k
    oversample_factor: 2
    log_gold_rank: true
    guided_injection: false        # off: let retrieval stay lossy so trajectories go deeper

    # depth & loop
    min_hops: 2
    max_steps: 6
    enforce_sufficiency: true
    sufficiency_mode: strict
    max_correction_attempts: 3
    force_first_tool: false        # gpt-oss tool-calls natively on "auto"; "required" returns empty

    # ── conversation plan (Stage 4): every row is multi-turn, each turn shaped by
    # its query kind; length + kind-mix sampled per row → a diverse dataset ──────
    min_turns: 3
    dedupe_retrieval: true             # each hop returns unseen chunks
    conversation_plan:
      num_turns: {min: 3, max: 5}      # always multi-turn; length varies per row
      follow_up_kinds:                 # what kind of query each follow-up is (type diversity)
        - {kind: complex_multistep, weight: 3}
        - {kind: crisp, weight: 3}
        - {kind: simple, weight: 2}
        - {kind: half_baked, weight: 2}
      kind_archetypes:                 # how each query kind shapes its turn (depth/clarify)
        half_baked:        {min_hops: 1, max_hops: 3, clarify: true}
        simple:            {min_hops: 1, max_hops: 2}
        crisp:             {min_hops: 2, max_hops: 4}
        complex_multistep: {min_hops: 4, max_hops: 8}

    # phased interaction
    allow_discussion: true
    max_discussion_exchanges: 2
    require_research_plan: true

    # context management (Stage 5a outer compression)
    context_window_k: 2
    compaction_mode: reference
    compression_token_limit: 2000  # budget for the compressible middle span
    preserve_last_user_turn: true
    use_scratchpad: true
    store_full_trace: true
    parallel_tools: true           # Stage 5: concurrent multi-tool turns

    # quality gates & yield
    gate_query: false              # keep yield up; grounding is enforced by the loop + judge
    salvage_min_hops: 2
    majority_vote_n: 1           # gpt-oss returns no tool calls when n>1
    error_injection_rate: 0.0
    max_tools: 12

persona:
  dataset: nvidia/Nemotron-Personas-India
  locale: en_IN

# ── tool catalog offered to the assistant ────────────────────────────────────
tools:
  - type: function
    function:
      name: search_articles
      description: Semantic search over the constitutional corpus; returns the most relevant passages.
      parameters:
        type: object
        properties:
          query: {type: string, description: Natural-language description of what you are looking for.}
        required: [query]
  - type: function
    function:
      name: get_article
      description: Retrieve the full text of a specific article by its number.
      parameters:
        type: object
        properties:
          article: {type: string, description: 'Article number, e.g. "21" or "371A".'}
        required: [article]

# ── output projection: OpenAI tool-calling trajectory for SFT ────────────────
output_projection:
  type: structured_messages
  source_field: conversation_messages
  messages_field: messages
  tools_field: tools
  metadata_fields: [cluster_id, conversation_plan, gold_rank_log, hops_taken,
                    salvaged, trajectory_judgment]
