[project]
name = "agentic-rag-plugin"
version = "0.1.0"
description = "Data Designer plugin: deep-research RAG trajectory generation"
requires-python = ">=3.10"
dependencies = [
    "data-designer",
    "sentence-transformers",   # all-MiniLM-L6-v2 retriever backend
    "numpy",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Data Designer discovers the plugin via this entry point (mirrors the reference).
[project.entry-points."data_designer.plugins"]
deep-research-simulator = "agentic_rag.plugin_entry:deep_research_simulator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_rag"]
