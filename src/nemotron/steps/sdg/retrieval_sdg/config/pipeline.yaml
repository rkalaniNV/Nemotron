# retrieval_sdg pipeline config — every knob lives here (domain-agnostic).
# Point `input_path` at your queries, set `retrieval.endpoint` at the retrieval
# service, swap the `tools` list for the customer's, and run. No Python changes needed.

# Each stage owns its input/output (paths are relative to THIS config file's directory):
#   Stage 0  query_gen : chunks_path/lancedb   -> query_gen.output   (OPTIONAL)
#   Stage A  query_prep: query_prep.input      -> query_prep.output  (seeds)
#   Stage B  engine    : query_prep.output     -> engine.output      (raw trajectories)

# ── Stage 0: query_gen — OPTIONAL (synthesize seed queries FROM the corpus) ────
# Reads the chunk corpus, clusters a bounded sample in embedding space, and generates
# diverse end-user questions (topic-cluster x kind). Writes them to `input_path`, which
# Stage A (query_prep) then dedups. (Answerability is NOT gated here — see `validate`.)
#
# OPTIONAL: delete this whole block (or omit `chunks_path` / `lancedb`) to SKIP query
# generation and start directly from an existing queries.jsonl at `input_path`.
query_gen:
  source: jsonl                                   # jsonl (embed chunks) | lancedb (read precomputed vectors)
  chunks_path: /home/rapaul/rapaul/ablation/chunks.jsonl
  # lancedb: {uri: /localhome/local-rkalani/nemo-retriever/lancedb-hindi-legal, table: hindi-legal-judgments}
  output: ../data/queries.generated.jsonl         # where generated queries are written (query_prep reads this)

  n_queries: 2000                                # THE knob — cluster count & pool size derive from it
  max_workers: 16                                 # query_gen concurrency (raised from 8 for the 10k run)
  validate: false                                 # NO answerability gate: real users don't pre-check retrieval,
                                                  # and it selects against the hard multi-hop queries we want.
                                                  # Query quality is judged downstream on the trajectory (evaluate.py).
  coarse: {enabled: true}                         # MiniLM coarse pre-clustering for topic diversity

  embedding:                                      # hosted embedding model (source: jsonl)
    backend: cohere                               # cohere (/v2/embed) | nim (retriever's /v1/embeddings) | minilm (local)
    endpoint: https://xtcr3jss-nemotron-3-embed-1b-rapaul-gcp.xenon.lepton.run/v2/embed
    api_key_env: LEPTON_API_TOKEN

  # ── advanced (all have code defaults; uncomment to tune) ─────────────────────
  # queries_per_cluster: 4   multi_hop_chunks: 3   cross_doc: true   candidate_headroom: 3.0
  # min_coverage: 0.35   model_alias: user_model   max_rounds: 3   seed: 7   max_workers: 8
  # kind_weights: {multi_hop: 4, comparative: 3, exploratory: 2, factual: 2, ambiguous: 1}
  # coarse: {enabled: true, candidate_size: 10000, coarse_k: 64}
  # clustering: {algo: kmeans, k: null, min_cluster_size: 5}   # pool_size / chunks_per_cluster also overridable
  # field_map: {text_field: text, id_field: chunk_id, doc_id_field: source_id, path_field: source_path}
  # embedding index-space alt: {backend: nim, model: nvidia/llama-nemotron-embed-1b-v2, endpoint: http://127.0.0.1:8001/v1, input_type: passage}

# ── Stage A: query_prep (offline; MiniLM only) — dedup + cluster + sample ──────
query_prep:
  input: ../data/queries.jsonl                # your queries (used when query_gen is OFF; else query_gen.output)
  output: ../data/seeds.jsonl                 # seeds -> the engine
  query_field: query
  dedup:
    threshold: 0.92                             # cosine >= this collapses near-duplicates
    embed_model: sentence-transformers/all-MiniLM-L6-v2
  clustering:
    algo: kmeans                                # kmeans | hdbscan | agglomerative
    k: null                                     # null => heuristic (kmeans/agglomerative)
    min_cluster_size: 5                         # hdbscan only
  sample:
    n_target: null                              # keep all. When query_gen runs, query_gen.n_queries is
                                                # the count; set this only to subsample an EXTERNAL query file.
    seed: 7

# ── persona (DD-native Person sampler) ────────────────────────────────────────
# One CONSTANT persona per row (=> per trajectory), used in EVERY user turn (with
# persona_voice, the opening too). Backed by the managed Nemotron-Personas dataset.
# One-time setup: data-designer download personas --locale en_IN
persona:
  enabled: true
  locale: en_IN                                 # en_US | en_IN | en_SG | fr_FR | hi_Deva_IN | hi_Latn_IN | ja_JP | ko_KR | pt_BR
  with_synthetic_personas: true                 # append persona/personality/interests descriptions

# ── models & providers ────────────────────────────────────────────────────────
providers:
  - name: lepton_gptoss
    endpoint: https://xtcr3jss-gpt-oss-120b-rapaul-gcp.xenon.lepton.run/v1
    api_key: LEPTON_API_TOKEN                      # Bearer token env var
  - name: lepton_gemma
    endpoint: https://xtcr3jss-gemma-4-31b-it-vllm-ravirajj-az-32k.xenon.lepton.run/v1
    api_key: LEPTON_API_KEY                        # open endpoint => unset is fine

# max_tokens are generous on purpose: gpt-oss-120b is a REASONING model — it spends
# tokens on its reasoning trace before the answer, so a tight cap truncates the trace
# or leaves the answer empty. Keep the assistant especially roomy.
models:
  - alias: assistant_model                       # the research agent — gpt-oss-120b (emits reasoning)
    model: openai/gpt-oss-120b
    provider: lepton_gptoss
    inference_parameters: {temperature: 0.7, max_tokens: 16384}
  - alias: user_model                            # simulates the human user — Gemma (32k ctx model)
    model: google/gemma-4-31B-it
    provider: lepton_gemma
    inference_parameters: {temperature: 0.8, max_tokens: 2000}
  - alias: aux_response_model                     # simulates non-retrieval tools — gpt-oss-120b
    model: openai/gpt-oss-120b
    provider: lepton_gptoss
    inference_parameters: {temperature: 0.4, max_tokens: 8192}
  - alias: judge_model                            # inline judge + query gate — gpt-oss-120b (reliable JSON)
    model: openai/gpt-oss-120b
    provider: lepton_gptoss
    inference_parameters: {temperature: 0.2, max_tokens: 16384}

# ── retrieval service (external HTTP wrapper) ─────────────────────────────────
retrieval:
  endpoint: http://10.117.9.203:8002/query        # service POST url; empty => the retrieval tool is LLM-simulated (dry runs)
  tools: [search]                                 # tool names routed to the service (others are LLM-simulated)
  top_k: 4
  oversample_factor: 2                            # request top_k*factor, keep a random top_k (drives depth)
  timeout: 120                                    # the service can be slow under load
  max_retries: 2                                  # bounded retries on transient blips (a flaky window costs depth, not the row)
  headers: {}
  field_map:                                      # matches this service: {query, num_chunks} -> {chunks:[{rank,text}]}
    query_field: query
    top_k_field: num_chunks                       # this service names it num_chunks (not top_k)
    results_path: chunks                          # response key holding the list ("" => body is the list)
    id_field: id                                  # absent here -> client falls back to a content hash
    text_field: text
    score_field: score                            # absent here -> defaults to 0.0 (rank order preserved)
    doc_id_field: doc_id                          # absent here -> ""

# ── user-defined tool list ────────────────────────────────────────────────────
# `search` is routed to the retrieval service (see retrieval.tools above); the
# other tools are LLM-simulated by aux_response_model.
tools:
  - function:
      name: search
      description: Retrieve the most relevant passages (chunks) from the knowledge base for a query.
      parameters:
        type: object
        properties:
          query: {type: string, description: The search query.}
        required: [query]
  - function:
      name: memory_read
      description: Read stored user preferences or facts remembered from earlier interactions.
      parameters:
        type: object
        properties:
          key: {type: string, description: The preference/fact key to look up (e.g. "preferred_citation_style").}
        required: [key]
  - function:
      name: memory_write
      description: Persist a user preference or fact for use in future turns/sessions.
      parameters:
        type: object
        properties:
          key: {type: string, description: The preference/fact key to store.}
          value: {type: string, description: The value to remember.}
        required: [key, value]

# ── Stage B: engine (-> ConversationSimulatorConfig) — seeds -> raw trajectories ─
engine:
  # ── I/O ──────────────────────────────────────────────────────────────────────
  input: ../data/seeds.jsonl                      # seeds from query_prep (used when running --stage generate alone)
  output: ../output/sdg/retrieval_sdg.raw.jsonl   # raw trajectories (judge with evaluate.py)
  # crash safety for long runs: DD checkpoints per row-group under artifact_path and
  # resumes from the last completed batch. On a crash, RE-RUN --stage generate to resume.
  resume: if_possible                             # never | if_possible | always
  artifact_path: ../output/sdg/dd_artifacts       # stable checkpoint dir (do not delete mid-run)
  column_name: conversation_messages
  metadata_fields: [cluster_id, hops_taken, conversation_status, trajectory_judgment, retrieval_log, compression, persona]

  # ── the two knobs that shape a conversation ──────────────────────────────────
  # length: turns are center-weighted, so a 3-6 range AVERAGES ~4-5 turns
  #         (with some 3s and 6s for diversity).
  min_turns: 3
  max_turns: 6
  # depth: how many search rounds (hops) each turn takes.
  min_hops: 2
  max_steps: 6

  # ── loop / quality control (sensible defaults, rarely changed) ───────────────
  max_correction_attempts: 3
  max_tool_calls_per_turn: 1                       # many endpoints reject >1
  force_first_tool: true                           # force a tool call until min_hops (grounding)
  allow_clarify: true                              # let clarify-kind turns ask a question first
  gate_query: false                                # inline eval OFF for now (no query gate)
  inline_judge: false                              # inline eval OFF for now (no per-trajectory judge)
  majority_vote_n: 1                               # assistant self-consistency samples
  max_tools: 12                                    # tool subset offered per row
  persona_voice: true                              # voice the opening turn in-persona too (all turns in-persona)

  # ── context compression ─────────────────────────────────────────────────────
  context_window_k: 2                              # recent tool results kept raw
  compaction_mode: reference
  compression_token_limit: 30000                   # keep the middle raw up to ~30k tokens before compressing
  use_scratchpad: true
