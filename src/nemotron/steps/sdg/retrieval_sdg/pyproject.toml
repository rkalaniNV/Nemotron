[project]
name = "retrieval-sdg"
version = "0.1.0"
description = "Module C: multi-turn retrieval-grounded conversation SDG (Data Designer plugin)"
requires-python = ">=3.10"
dependencies = [
    "data-designer",
    "sentence-transformers",   # all-MiniLM-L6-v2: query dedup + clustering only
    "scikit-learn",            # query clustering (kmeans/hdbscan/agglomerative)
    "numpy",
    "pydantic",
    "requests",                # Module A retrieval POST client
    "openai",                  # direct tool-calling clients + offline callers
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
lancedb = ["lancedb"]          # only for query_gen source: lancedb (reads precomputed vectors)

# Data Designer discovers the plugin via this entry point.
[project.entry-points."data_designer.plugins"]
retrieval-sdg = "retrieval_sdg.plugin:conversation_simulator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval_sdg"]
