# Tiny SFT for a remote cluster profile, for example `--run YOUR-CLUSTER`.
# Pulls base weights from HuggingFace via AutoBridge so no pre-existing
# Megatron checkpoint is required. Uses the packed_parquet shards produced by
# `nemotron steps run data_prep/sft_packing -c tiny --run YOUR-CLUSTER`.
#
# Note: dataset paths are explicit (Megatron-Bridge's vanilla schema). This
# step is generic — recipe-specific dir shortcuts live in recipes/, not here.

run:
  data: null
  env:
    container: nvcr.io/nvidia/nemo:26.02.nemotron_3_super

# Base init priority: resume > pretrained_checkpoint > HF.
# Default: load base weights from HuggingFace via AutoBridge (no Megatron base needed).
# To start from a Megatron checkpoint instead, uncomment pretrained_checkpoint in the
# checkpoint block below. To resume, see the checkpoint block.
# hf_model_path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
# trust_remote_code: true
# load_hf_weights: true

recipe:
  _target_: megatron.bridge.recipes.nemotronh.nemotron_3_super.nemotron_3_super_finetune_config
  peft: null
  packed_sequence: true
  seq_length: 131072
  tensor_model_parallel_size: 8
  pipeline_model_parallel_size: 1
  context_parallelism: 8
  sequence_parallelism: true
  expert_model_parallelism: 64
  expert_tensor_parallelism: 1
  finetune_lr: 5.0e-6
  min_lr: 0.0
  lr_warmup_iters: 50

dataset:
  seq_length: 131072
  # Fixed-length batches are required for packed SFT + CP>1 (Megatron-Bridge).
  dataset_kwargs:
    pad_to_max_length: true
  packed_sequence_specs:
    packed_sequence_size: 131072
    # Must match packing pad_seq_to_mult. With CP=8, TP=8, sequence_parallel on:
    # 2*CP*TP = 2*8*8 = 128. Repack to packed_128k_cp8 with that pad; cp32/pad=32 is wrong.
    pad_seq_to_mult: 128
    packed_train_data_path: /mnt/lustre-shared/hvnguyen/projects/ytl/data/super_npy/packed_128k_cp8/splits/train
    packed_val_data_path: /mnt/lustre-shared/hvnguyen/projects/ytl/data/super_npy/packed_128k_cp8/splits/train
    packed_test_data_path: /mnt/lustre-shared/hvnguyen/projects/ytl/data/super_npy/packed_128k_cp8/splits/train

train:
  train_iters: 100
  global_batch_size: 1
  micro_batch_size: 1
  eval_interval: 10
  eval_iters: 1

model:
  seq_length: 131072
  tensor_model_parallel_size: 8
  pipeline_model_parallel_size: 1
  context_parallel_size: 8
  expert_model_parallel_size: 64
  expert_tensor_parallel_size: 1
  sequence_parallel: true
  calculate_per_token_loss: true
  recompute_granularity: "selective"
  recompute_modules: ["moe"]
  moe_router_load_balancing_type: "none"
  # MTP (multi-token prediction) is incompatible with packed sequences + CP>1
  # in nemo:26.02 (crashes in multi_token_prediction._roll_tensor_packed_seq).
  # Disable it so context parallelism can be used for long-context SFT.
  mtp_num_layers: 0

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: /mnt/lustre-shared/hvnguyen/models/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16

ddp:
  check_for_nan_in_grad: false
  grad_reduce_in_fp32: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  average_in_collective: false
  use_distributed_optimizer: true

logger:
  log_interval: 1
  wandb_project: Megatron-Bridge-CPT-Nemotron-3-Nano-30B 
  wandb_entity: nvidia
  wandb_exp_name: nemotron-3-super-120b-a12b-sft-128k-cp8

checkpoint:
  # Where checkpoints are written.
  save: /mnt/lustre-shared/hvnguyen/checkpoints/ytl_super_sft_128k

  # Base from a Megatron checkpoint instead of HF: uncomment to finetune from it.
  # When set it takes priority over the HF base above; if set but not a real
  # checkpoint the run fails fast (it does not silently fall back to HF).
  pretrained_checkpoint: /mnt/lustre-shared/hvnguyen/checkpoints/superv3-viettel-custom-code/iter_0000010

  # Resume an interrupted run: point `load` at a checkpoint directory. It defaults
  # to `save`, so re-running with the same `save` already auto-resumes. Megatron-Bridge
  # reads the tracker file in that dir, finds the latest iteration, and loads its
  # `iter_<N>/` subdir (optimizer + RNG included). Uncomment to set it explicitly:
  # load: ${oc.env:SFT_OUTPUT_DIR}/sft-tiny-2node

  # By default the latest iteration is loaded. To resume from a specific iteration
  # instead, set ckpt_step to N and it loads that `iter_<N>/`. Uncomment to use:
  # ckpt_step: 100

  save_interval: 10
  finetune: true

mixed_precision: bf16_mixed

# comm_overlap:
#   tp_comm_overlap: false
#   data_parallel_size: 2

rng:
  seed: 1234

dist:
  # First run builds GPTDataset shuffle indices on rank 0 while other ranks wait
  # at a collective. For this large blend (~1B samples) the build exceeds the
  # default 10-minute NCCL timeout and triggers a watchdog ALLREDUCE timeout.
  # Indices are cached at dataset.path_to_cache, so this is a one-time cost.
  distributed_timeout_minutes: 120