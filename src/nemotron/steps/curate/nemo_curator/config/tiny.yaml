# Tiny NeMo Curator smoke using the Curator container as-is.
# Optional filters are disabled so this verifies reader, writer, Ray startup,
# and the packaged tiny JSONL path without downloading models.

language_codes: []

domains: []
text_field: text
input_glob: /nemo_run/code/src/nemotron/steps/curate/nemo_curator/data/tiny.jsonl
output_dir: ${oc.env:NEMO_RUN_DIR,${oc.env:PWD}/output}/curate_nemo_curator_tiny

dataset: null

# Exercises the manifest path in the smoke run. The packaged tiny JSONL has no
# id/source columns, so both stay null and the manifest carries counts only.
metadata_fields: []
id_field: null
source_field: null
emit_manifest: ${oc.env:NEMO_RUN_DIR,${oc.env:PWD}/output}/curate_nemo_curator_tiny/run_manifest.json

models: {}

quality_filters: {}
