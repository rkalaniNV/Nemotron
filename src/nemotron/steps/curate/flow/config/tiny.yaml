# CPU smoke config for the flow seam: ingest the packaged JSONL fixture without
# a tokenizer download, GPU, Ray filter, policy, or language pack. Profiling is
# disabled because production language packs are supplied by users, not bundled.

corpus:
  input: /nemo_run/code/src/nemotron/steps/curate/profile/data/tiny/*.jsonl
  text_field: text
  id_field: id
  id_field_in_source: true
  source_field: source
  source_field_in_source: source
  metadata_fields: [id, source]

output_root: ${oc.env:NEMO_RUN_DIR,${oc.env:PWD}/output}/curate_flow_tiny

steps:
  ingest:
    enabled: true
    on_duplicate: refuse

  profile:
    enabled: false
  filter:
    enabled: false     # needs nemo_curator + a Ray cluster
  audit:
    enabled: false     # nothing to audit without the filter
  subset:
    enabled: false
  decontamination:
    enabled: false

approve: null
