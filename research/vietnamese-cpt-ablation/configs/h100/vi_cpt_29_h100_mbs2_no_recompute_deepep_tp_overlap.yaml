defaults: ../baseline/vi_cpt_32_h100_gcp_hardware_baseline.yaml

# No-recompute memory/speed probe on the DeepEP+TPO path. Run after case 24
# shows memory headroom; stop on OOM.
run:
  env:
    job_name: vi-h100-29-no-recompute

model:
  recompute_granularity: null
  recompute_method: null
  recompute_num_layers: null
  moe_enable_deepep: true
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: deepep
  moe_shared_expert_overlap: false

comm_overlap:
  tp_comm_overlap: true

logger:
  wandb_exp_name: ${oc.env:WANDB_NAME,vi-cpt-29-h100-mbs2-no-recompute-deepep-tp-overlap}
  wandb_save_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/29-h100-mbs2-no-recompute-deepep-tp-overlap/wandb
  tensorboard_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/29-h100-mbs2-no-recompute-deepep-tp-overlap/tensorboard

checkpoint:
  save: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/29-h100-mbs2-no-recompute-deepep-tp-overlap
