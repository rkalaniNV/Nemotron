defaults: ../baseline/vi_cpt_32_h100_gcp_hardware_baseline.yaml

# Conditional MBS=4 probe after case 24 is stable (full recompute origin).
run:
  env:
    job_name: vi-h100-25-deepep-tpo-mbs4

model:
  moe_enable_deepep: true
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: deepep
  moe_shared_expert_overlap: false

train:
  micro_batch_size: 4

comm_overlap:
  tp_comm_overlap: true

logger:
  wandb_exp_name: ${oc.env:WANDB_NAME,vi-cpt-25-h100-mbs4-deepep-tp-overlap}
  wandb_save_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/25-h100-mbs4-deepep-tp-overlap/wandb
  tensorboard_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/25-h100-mbs4-deepep-tp-overlap/tensorboard

checkpoint:
  save: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/25-h100-mbs4-deepep-tp-overlap
