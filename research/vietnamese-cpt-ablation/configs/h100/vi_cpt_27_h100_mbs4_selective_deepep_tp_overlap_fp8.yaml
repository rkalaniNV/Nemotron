defaults: ../baseline/vi_cpt_32_h100_gcp_hardware_baseline.yaml

# Conditional FP8 + MBS=4 after case 26 is numerically healthy.
run:
  env:
    job_name: vi-h100-27-fp8-deepep-mbs4

model:
  moe_enable_deepep: true
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: deepep
  moe_shared_expert_overlap: false
  moe_router_padding_for_fp8: true

train:
  micro_batch_size: 4

comm_overlap:
  tp_comm_overlap: true

mixed_precision: bf16_with_fp8_current_scaling_mixed

logger:
  wandb_exp_name: ${oc.env:WANDB_NAME,vi-cpt-27-h100-mbs4-deepep-tp-overlap-fp8}
  wandb_save_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/27-h100-mbs4-deepep-tp-overlap-fp8/wandb
  tensorboard_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/27-h100-mbs4-deepep-tp-overlap-fp8/tensorboard

checkpoint:
  save: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/27-h100-mbs4-deepep-tp-overlap-fp8
