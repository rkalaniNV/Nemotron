# Standalone A100 hardware baseline for Vietnamese CPT runtime studies.
# A100 experiments inherit this root directly; this file has no parent.
# Container matched to the H100 control (vi_cpt_32) on nemo:26.02.

run:
  env:
    container_image: nvcr.io/nvidia/nemo:26.02
    job_name: vi-hw-31-a100-baseline
    env_vars:
      # A100 has no CUDA Multicast. Force the TE IPC fallback.
      UB_SKIPMC: "1"
      CUDA_DEVICE_MAX_CONNECTIONS: "1"

mode: cpt

hf_model_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
load_hf_weights: true
trust_remote_code: true

recipe:
  _target_: megatron.bridge.recipes.nemotronh.nemotron_3_nano.nemotron_3_nano_pretrain_config

model:
  moe_enable_deepep: false
  seq_length: 8192
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  expert_model_parallel_size: 8
  expert_tensor_parallel_size: 1
  sequence_parallel: true
  moe_token_dispatcher_type: alltoall
  moe_per_layer_logging: true

dataset:
  path_to_cache: /mnt/lustre-shared/hvnguyen/data/.cache
  per_split_data_args_path: ${oc.env:PRETRAIN_BLEND_PATH}

# Without this the run silently builds a NullTokenizer (vocab 32000 padded to
# 131072) and every loss number is meaningless.
tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16

train:
  # A short performance screen. Override this for confirmation/final runs.
  train_iters: 200
  global_batch_size: 512
  micro_batch_size: 1

optimizer:
  lr: 3.0e-5
  min_lr: 3.0e-6

scheduler:
  lr_warmup_iters: 10

logger:
  log_interval: 5
  wandb_project: ${oc.select:run.wandb.project,${oc.env:WANDB_PROJECT,Nemotron-3-Nano-CPT-Ablation-Study}}
  wandb_entity: ${oc.select:run.wandb.entity,${oc.env:WANDB_ENTITY,nvidia}}
  wandb_exp_name: ${oc.env:WANDB_NAME,vi-cpt-31-a100-hardware-baseline}
  wandb_save_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-hardware-baseline/31-a100/wandb

  # Native Megatron-Bridge performance reporting.
  log_throughput: true
  log_progress: true
  log_throughput_to_tensorboard: true
  tensorboard_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-hardware-baseline/31-a100/tensorboard
  tensorboard_log_interval: 5
  log_timers_to_tensorboard: true
  log_world_size_to_tensorboard: true
  timing_log_level: 1
  timing_log_option: max
  throughput_window_size: 20

checkpoint:
  save: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-hardware-baseline/31-a100
  save_interval: 50
  fully_parallel_save: true

# Mirrors lepton_opt.yaml so screened throughput reflects the production setup.
ddp:
  check_for_nan_in_grad: false
  average_in_collective: true

# bf16_mixed and grad_reduce_in_fp32=True inherit from the container recipe.

comm_overlap:
  # Userbuffers TP overlap needs Hopper CUDA Multicast. A100 falls back to the
  # UB_SKIPMC=1 IPC path, which can corrupt TP GEMM outputs.
  tp_comm_overlap: false

dist:
  # The first run over a new blend builds shuffle indices on rank 0, which can
  # exceed the 10-minute default before the indices are cached.
  distributed_timeout_minutes: 120
