defaults: ../baseline/vi_cpt_31_a100_hardware_baseline.yaml

# Out of the main study queue (CP is fixed at 1), but kept runnable for
# memory-probe experiments that need context parallelism.
run:
  env:
    job_name: vi-a100-18-cp2-mbs4

model:
  context_parallel_size: 2
  recompute_granularity: selective
  recompute_method: null
  recompute_num_layers: null

train:
  micro_batch_size: 4

logger:
  wandb_exp_name: ${oc.env:WANDB_NAME,vi-cpt-18-cp2-mbs4-recompute-selective}
  wandb_save_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/18-cp2-mbs4-recompute-selective/wandb
  tensorboard_dir: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/18-cp2-mbs4-recompute-selective/tensorboard

checkpoint:
  save: ${oc.env:PRETRAIN_OUTPUT_DIR}/vi-cpt-ablation/18-cp2-mbs4-recompute-selective
